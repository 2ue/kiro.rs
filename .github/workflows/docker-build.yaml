name: Publish Docker Images

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: docker-publish-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: kiro-rs

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION_WITHOUT_V="${VERSION#v}"
          if [[ ! "$VERSION_WITHOUT_V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Docker publish tags must use Git tag format vMAJOR.MINOR.PATCH, for example v0.0.2."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_without_v=${VERSION_WITHOUT_V}" >> "$GITHUB_OUTPUT"

      - name: Set image names
        id: images
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          DOCKERHUB_IMAGE="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          echo "ghcr_image=${GHCR_IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${DOCKERHUB_IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Set platform pair
        id: platform
        shell: bash
        run: |
          PLATFORM_PAIR="${{ matrix.platform }}"
          echo "pair=${PLATFORM_PAIR//\//-}" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Docker Hub publish requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          outputs: type=image,name="${{ steps.images.outputs.ghcr_image }},${{ steps.images.outputs.dockerhub_image }}",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Kiro.rs Docker Image
            org.opencontainers.image.version=${{ steps.version.outputs.version_without_v }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::Build did not return an image digest."
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION_WITHOUT_V="${VERSION#v}"
          if [[ ! "$VERSION_WITHOUT_V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Docker publish tags must use Git tag format vMAJOR.MINOR.PATCH, for example v0.0.2."
            exit 1
          fi
          echo "version_without_v=${VERSION_WITHOUT_V}" >> "$GITHUB_OUTPUT"

      - name: Set image names
        id: images
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          DOCKERHUB_IMAGE="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          echo "ghcr_image=${GHCR_IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${DOCKERHUB_IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        shell: bash
        run: |
          VERSION_WITHOUT_V="${{ steps.version.outputs.version_without_v }}"
          GHCR_IMAGE="${{ steps.images.outputs.ghcr_image }}"
          DOCKERHUB_IMAGE="${{ steps.images.outputs.dockerhub_image }}"

          mapfile -t DIGESTS < <(find /tmp/digests -maxdepth 1 -type f -exec basename {} \; | sort)
          if [ "${#DIGESTS[@]}" -eq 0 ]; then
            echo "::error::No image digests were downloaded."
            exit 1
          fi
          if [ "${#DIGESTS[@]}" -lt 2 ]; then
            echo "::error::Expected both amd64 and arm64 image digests, got ${#DIGESTS[@]}."
            exit 1
          fi

          create_manifest() {
            local image="$1"
            shift

            local refs=()
            for digest in "${DIGESTS[@]}"; do
              if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
                echo "::error::Invalid digest artifact name: $digest"
                exit 1
              fi
              refs+=("${image}@sha256:${digest}")
            done

            docker buildx imagetools create \
              -t "${image}:${VERSION_WITHOUT_V}" \
              -t "${image}:latest" \
              "${refs[@]}"
          }

          create_manifest "$GHCR_IMAGE"
          create_manifest "$DOCKERHUB_IMAGE"
