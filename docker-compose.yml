services:
  kiro-rs:
    image: ${KIRO_RS_IMAGE:-ghcr.io/2ue/kiro-rs}:${KIRO_RS_VERSION:-latest}
    container_name: kiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${KIRO_RS_PORT:-8990}:8990"
    volumes:
      - ./config/:/app/config/
      - ./logs/:/app/logs/
    restart: unless-stopped
    # A listening TCP socket can remain healthy while the HTTP runtime is stalled by a
    # scheduler backlog. Probe the readiness contract so Docker removes a wedged instance from
    # service instead of reporting a false healthy container.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null -T 4 http://127.0.0.1:8990/readyz || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
