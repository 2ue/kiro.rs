services:
  kiro-rs:
    image: ${KIRO_RS_IMAGE:-ghcr.io/2ue/kiro-rs}:${KIRO_RS_VERSION:-latest}
    container_name: kiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${KIRO_RS_PORT:-8990}:8990"
    volumes:
      - ./config/:/app/config/
    environment:
      # 默认连本机已起的 pg/redis（host.docker.internal 指向宿主机）
      DATABASE_URL: ${DATABASE_URL:-postgres://kiro_rs:kiro_rs_dev_pwd@host.docker.internal:5433/kiro_rs}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6380/0}
    restart: unless-stopped
