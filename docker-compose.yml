services:
  kiro-rs:
    image: ${KIRO_RS_IMAGE:-ghcr.io/2ue/kiro-rs}:${KIRO_RS_VERSION:-latest}
    container_name: kiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${KIRO_RS_PORT:-8990}:8990"
    volumes:
      - ./config/:/app/config/
    restart: unless-stopped
