services:
  claude-pool:
    image: ${CLAUDE_POOL_IMAGE:-ghcr.io/2ue/claude-pool}:${CLAUDE_POOL_VERSION:-latest}
    container_name: claude-pool
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CLAUDE_POOL_PORT:-8990}:8990"
    volumes:
      - ./config/:/app/config/
      - ./logs/:/app/logs/
    restart: unless-stopped
