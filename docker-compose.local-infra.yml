services:
  account-runtime-postgres-local:
    image: postgres:16-alpine
    container_name: account-runtime-postgres-local
    environment:
      POSTGRES_DB: ${ACCOUNT_RUNTIME_POSTGRES_DB:-account_runtime}
      POSTGRES_USER: ${ACCOUNT_RUNTIME_POSTGRES_USER:-account_runtime}
      POSTGRES_PASSWORD: ${ACCOUNT_RUNTIME_POSTGRES_PASSWORD:-account_runtime_dev_password}
    ports:
      - "${ACCOUNT_RUNTIME_POSTGRES_PORT:-25432}:5432"
    volumes:
      - account-runtime-postgres-local-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ACCOUNT_RUNTIME_POSTGRES_USER:-account_runtime} -d ${ACCOUNT_RUNTIME_POSTGRES_DB:-account_runtime}"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  account-runtime-redis-local:
    image: redis:7-alpine
    container_name: account-runtime-redis-local
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    ports:
      - "${ACCOUNT_RUNTIME_REDIS_PORT:-26379}:6379"
    volumes:
      - account-runtime-redis-local-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  account-runtime-postgres-local-data:
  account-runtime-redis-local-data:
