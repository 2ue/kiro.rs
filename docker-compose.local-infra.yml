services:
  claude-pool-postgres-local:
    image: postgres:16-alpine
    container_name: claude-pool-postgres-local
    environment:
      POSTGRES_DB: ${CLAUDE_POOL_POSTGRES_DB:-claude_pool}
      POSTGRES_USER: ${CLAUDE_POOL_POSTGRES_USER:-claude_pool}
      POSTGRES_PASSWORD: ${CLAUDE_POOL_POSTGRES_PASSWORD:-claude_pool_dev_password}
    ports:
      - "${CLAUDE_POOL_POSTGRES_PORT:-25432}:5432"
    volumes:
      - claude-pool-postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CLAUDE_POOL_POSTGRES_USER:-claude_pool} -d ${CLAUDE_POOL_POSTGRES_DB:-claude_pool}"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  claude-pool-redis-local:
    image: redis:7-alpine
    container_name: claude-pool-redis-local
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    ports:
      - "${CLAUDE_POOL_REDIS_PORT:-26379}:6379"
    volumes:
      - claude-pool-redis-local-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  claude-pool-postgres-local-data:
  claude-pool-redis-local-data:
