services:
  claude-pool-postgres:
    image: postgres:18-alpine
    container_name: claude-pool-postgres
    environment:
      POSTGRES_DB: ${CLAUDE_POOL_POSTGRES_DB:-claude_pool}
      POSTGRES_USER: ${CLAUDE_POOL_POSTGRES_USER:-claude_pool}
      POSTGRES_PASSWORD: ${CLAUDE_POOL_POSTGRES_PASSWORD:-change-me}
    volumes:
      - claude-pool-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CLAUDE_POOL_POSTGRES_USER:-claude_pool} -d ${CLAUDE_POOL_POSTGRES_DB:-claude_pool}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  claude-pool-redis:
    image: redis:7-alpine
    container_name: claude-pool-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    volumes:
      - claude-pool-redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  claude-pool-app:
    image: ${CLAUDE_POOL_IMAGE:-ghcr.io/2ue/claude-pool}:${CLAUDE_POOL_VERSION:-latest}
    container_name: claude-pool-app
    depends_on:
      claude-pool-postgres:
        condition: service_healthy
      claude-pool-redis:
        condition: service_healthy
    environment:
      CLAUDE_POOL_POSTGRES_URL: postgres://${CLAUDE_POOL_POSTGRES_USER:-claude_pool}:${CLAUDE_POOL_POSTGRES_PASSWORD:-change-me}@claude-pool-postgres:5432/${CLAUDE_POOL_POSTGRES_DB:-claude_pool}
      CLAUDE_POOL_POSTGRES_MIGRATE_ON_START: ${CLAUDE_POOL_POSTGRES_MIGRATE_ON_START:-true}
      CLAUDE_POOL_REDIS_URL: redis://claude-pool-redis:6379/0
    ports:
      - "${CLAUDE_POOL_PORT:-8990}:8990"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  claude-pool-postgres-data:
  claude-pool-redis-data:
