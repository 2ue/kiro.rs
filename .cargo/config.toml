# 项目级 cargo 配置
#
# 背景:此机器 PATH 上的 `cc` 被其他工具(volta)劫持成了非 C 编译器,
# 会让 cargo 在调用 build script 链接器时报 `unknown option '-Wl,...'`。
# 这里把 macOS 目标的链接器显式指回 Xcode clang,只对本项目生效。
[target.aarch64-apple-darwin]
linker = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"

[target.x86_64-apple-darwin]
linker = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"

[env]
# build script 也会调 cc;这里给一个肯定可用的真实 clang
CC = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
CXX = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
# macOS SDK 根,clang 链接 -lSystem 时需要
SDKROOT = "/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"
# 把 volta 从 PATH 中前置移除,优先走 /usr/bin
PATH = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin:/Library/Developer/CommandLineTools/usr/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin"

# sqlx-cli 离线模式开关,迁移文件改动后无需联连数据库即可编译
SQLX_OFFLINE = "true"
