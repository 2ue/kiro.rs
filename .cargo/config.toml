[build]
target-dir = "/tmp/kiro-rs-rust-analyzer-target"

[target.aarch64-apple-darwin]
linker = "/usr/bin/cc"

[env]
CC_aarch64_apple_darwin = "/usr/bin/cc"
# Test threads in debug builds: unoptimized async handler futures need more than the 2 MiB
# default. Release builds stay well within the 2 MiB tokio worker stack used in production.
RUST_MIN_STACK = "8388608"
