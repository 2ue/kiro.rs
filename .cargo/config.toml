# 项目级 cargo 配置
#
# 背景:此机器 PATH 上的 `cc` 被其他工具(volta)劫持成了非 C 编译器,
# 会让 cargo 在调用 build script 链接器时报 `unknown option '-Wl,...'`。
# 这里把 macOS 目标的链接器显式指回 Xcode clang,只对本项目生效。
[target.aarch64-apple-darwin]
linker = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
rustflags = [
  "-C",
  "link-arg=-isysroot",
  "-C",
  "link-arg=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk",
]

[target.x86_64-apple-darwin]
linker = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
rustflags = [
  "-C",
  "link-arg=-isysroot",
  "-C",
  "link-arg=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk",
]

[env]
# build script 也会调 cc;这里只给 macOS target 设置真实 clang。
# 不要设置全局 CC/CXX/SDKROOT,否则 Ubuntu CI 会读到不存在的 Xcode 路径。
CC_aarch64_apple_darwin = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
CXX_aarch64_apple_darwin = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
CFLAGS_aarch64_apple_darwin = "-isysroot /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"
CXXFLAGS_aarch64_apple_darwin = "-isysroot /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"
CC_x86_64_apple_darwin = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
CXX_x86_64_apple_darwin = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++"
CFLAGS_x86_64_apple_darwin = "-isysroot /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"
CXXFLAGS_x86_64_apple_darwin = "-isysroot /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk"

# sqlx-cli 离线模式开关,迁移文件改动后无需联连数据库即可编译
SQLX_OFFLINE = "true"
